<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js"></script>

  <title>Study Buddy</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
  <!-- LOGIN -->
  <div class="login-screen" id="loginScreen">
    <h1>🤖 Study Buddy</h1>
    <p>Enter your user ID</p>
    <input id="loginUserIdInput" placeholder="user123" />
    <button id="loginButton">Start Chat</button>
  </div>

  <!-- MAIN LAYOUT -->
  <div class="chat-layout" id="chatLayout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <button class="new-chat-btn" id="newChatBtn">＋ New Chat</button>
      <div class="thread-list" id="threadList"></div>
    </aside>

    <!-- CHAT -->
    <div class="chat-container">
      <div class="chat-header">🤖 Study Buddy</div>
      <div class="chat-messages" id="chatMessages"></div>

      <div class="chat-input-container">
        <div class="input-wrapper">
          <textarea id="messageInput" placeholder="Type your message… (Shift+Enter for new line)"></textarea>
          <button id="sendButton">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/main.js"></script>
</body>

</html>
