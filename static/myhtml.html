<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js"></script>
    <title>Study Buddy Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            word-wrap: break-word;
            word-break: break-word;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .typing-indicator {
            display: inline-block;
        }

        .typing-indicator::after {
            content: "▋";
            animation: blink 1s infinite;
            color: #667eea;
        }

        @keyframes blink {

            0%,
            50% {
                opacity: 1;
            }

            51%,
            100% {
                opacity: 0;
            }
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        #messageInput {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #messageInput:focus {
            border-color: #667eea;
        }

        #sendButton {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        #sendButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Login screen styles */
        .login-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .login-screen h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: white;
        }

        .login-screen p {
            font-size: 16px;
            margin-bottom: 30px;
            color: rgba(255, 255, 255, 0.9);
        }

        .login-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        #loginUserIdInput {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            background: rgba(255, 255, 255, 0.95);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        #loginUserIdInput:focus {
            border-color: white;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3);
        }

        #loginButton {
            padding: 14px 32px;
            background: white;
            color: #667eea;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #loginButton:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        #loginButton:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .chat-container.active {
            display: flex;
        }

        /* Scrollbar styling */
        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>

<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <h1>🤖 Study Buddy Chat</h1>
        <p>Enter your user ID to start chatting</p>
        <div class="login-input-wrapper">
            <input type="text" id="loginUserIdInput" placeholder="Enter your user ID (e.g., user123)"
                autocomplete="off" />
            <button id="loginButton">Start Chatting</button>
        </div>
    </div>

    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
        <div class="chat-header">🤖 Study Buddy Chat</div>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-container">
            <div class="input-wrapper">
                <input type="text" id="messageInput" placeholder="Type your message..." autocomplete="off" />
                <button id="sendButton">Send</button>
            </div>
        </div>
    </div>

    <script>
        const loginScreen = document.getElementById("loginScreen");
        const chatContainer = document.getElementById("chatContainer");
        const loginUserIdInput = document.getElementById("loginUserIdInput");
        const loginButton = document.getElementById("loginButton");
        const chatMessages = document.getElementById("chatMessages");
        const messageInput = document.getElementById("messageInput");
        const sendButton = document.getElementById("sendButton");

        // Get API base URL (assuming same origin, adjust if needed)
        const API_BASE = window.location.origin;

        // Store current user ID
        let currentUserId = null;

        function addMessage(content, role) {
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${role}`;

            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            // Use textContent with pre-wrap CSS to preserve formatting safely
            contentDiv.textContent = content;

            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return contentDiv;
        }

        async function loadChatHistory() {
            if (!currentUserId) return;

            try {
                const response = await fetch(
                    `${API_BASE}/chats?user_id=${encodeURIComponent(currentUserId)}`
                );

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                // Clear existing messages
                chatMessages.innerHTML = "";

                // Display history messages (they should be in chronological order)
                if (data.messages && data.messages.length > 0) {
                    // Reverse to show oldest first (since API returns newest first)
                    const sortedMessages = [...data.messages].reverse();

                    sortedMessages.forEach((msg) => {
                        addMessage(msg.content, msg.role);
                    });

                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }
            } catch (error) {
                console.error("Error loading chat history:", error);
                // Don't show error to user, just log it
            }
        }

        function addStreamingMessage() {
            const messageDiv = document.createElement("div");
            messageDiv.className = "message assistant";

            const contentDiv = document.createElement("div");
            contentDiv.className = "message-content";
            contentDiv.innerHTML = '<span class="typing-indicator"></span>';

            messageDiv.appendChild(contentDiv);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            return contentDiv;
        }

        async function sendMessage() {
            const message = messageInput.value.trim();

            if (!message || !currentUserId) return;

            // Disable input while sending
            messageInput.disabled = true;
            sendButton.disabled = true;

            // Add user message
            addMessage(message, "user");
            messageInput.value = "";

            // Create streaming message container
            const streamingDiv = addStreamingMessage();
            const typingIndicator = streamingDiv.querySelector(".typing-indicator");
            let fullResponse = "";

            try {
                const response = await fetch(`${API_BASE}/chat_streams`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        user_id: currentUserId,
                        message: message,
                    }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) break;

                    // Decode chunk, handling potential incomplete UTF-8 sequences
                    let chunk;
                    try {
                        chunk = decoder.decode(value, { stream: true });
                    } catch (e) {
                        console.warn("Decoding error:", e);
                        continue;
                    }

                    if (chunk) {
                        fullResponse += chunk;

                        // Remove typing indicator and update content
                        if (typingIndicator) {
                            typingIndicator.remove();
                        }
                        // Use textContent with pre-wrap CSS to preserve formatting safely
                        streamingDiv.textContent = fullResponse;
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                }

                // Final decode to handle any remaining bytes
                try {
                    const finalChunk = decoder.decode();
                    if (finalChunk) {
                        fullResponse += finalChunk;
                        streamingDiv.textContent = fullResponse;
                        chatMessages.scrollTop = chatMessages.scrollHeight;
                    }
                } catch (e) {
                    // Ignore final decode errors
                }
            } catch (error) {
                console.error("Error:", error);
                streamingDiv.textContent =
                    "Sorry, an error occurred. Please try again.";
                streamingDiv.style.color = "#e74c3c";
            } finally {
                // Re-enable input
                messageInput.disabled = false;
                sendButton.disabled = false;
                messageInput.focus();
            }
        }

        // Login function
        function handleLogin() {
            const userId = loginUserIdInput.value.trim();

            if (!userId) {
                alert("Please enter a user ID");
                return;
            }

            currentUserId = userId;

            // Hide login screen and show chat
            loginScreen.style.display = "none";
            chatContainer.classList.add("active");

            // Load chat history
            loadChatHistory();

            // Focus message input
            messageInput.focus();
        }

        // Event listeners
        loginButton.addEventListener("click", handleLogin);

        loginUserIdInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                handleLogin();
            }
        });

        sendButton.addEventListener("click", sendMessage);

        messageInput.addEventListener("keypress", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Focus login input on page load
        window.addEventListener("load", () => {
            loginUserIdInput.focus();
        });
    </script>
</body>

</html>
